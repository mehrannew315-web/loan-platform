<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آسان وام | بازار آنلاین خرید و فروش امتیاز وام</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- هدر سایت -->
    <header class="bg-blue-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="bg-blue-600 p-2 rounded-xl text-lg font-black">💳</span>
                <div>
                    <h1 class="text-lg font-black tracking-wide">آسان وام</h1>
                    <p class="text-[10px] text-blue-200">مرجع امن خرید و فروش امتیاز وام</p>
                </div>
            </div>
            <div id="auth-section">
                <button onclick="openRegisterModal()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-xl text-xs font-semibold transition shadow-sm">
                    ورود / ثبت‌نام فروشنده
                </button>
            </div>
        </div>
    </header>

    <!-- مودال ثبت‌نام -->
    <div id="registerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-base font-bold text-slate-900">حساب کاربری فروشنده</h3>
                <button onclick="closeRegisterModal()" class="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
            </div>
            <form onsubmit="saveUser(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">نام و نام خانوادگی</label>
                    <input type="text" id="regName" required placeholder="مثلاً رضا مرادی" class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">شماره تماس (جهت ارتباط خریدار)</label>
                    <input type="tel" id="regPhone" required placeholder="09123456789" class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">شهر محل سکونت</label>
                    <input type="text" id="regCity" required placeholder="مثلاً مشهد" class="w-full border border-slate-200 rounded-xl p-3 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="pt-2 flex gap-2">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl text-xs font-bold transition shadow-md">تایید و ذخیره مشخصات</button>
                </div>
            </form>
        </div>
    </div>

    <!-- بدنه اصلی سایت -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- فرم ثبت آگهی -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 h-fit">
            <div class="flex items-center space-x-2 space-x-reverse mb-4 pb-3 border-b border-slate-100">
                <span class="text-blue-600 font-bold">📝</span>
                <h2 class="text-sm font-black text-slate-800">ثبت آگهی واگذاری امتیاز وام</h2>
            </div>
            
            <form id="loan-form" onsubmit="submitLoan(event)" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">بانک عامل</label>
                    <input type="text" id="bankName" required placeholder="مثلاً بانک رسالت / ملی" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">شهر وام</label>
                        <input type="text" id="city" required placeholder="تهران" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">نوع وام</label>
                        <select id="loanType" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="وام ازدواج">وام ازدواج</option>
                            <option value="وام مسکن">وام مسکن</option>
                            <option value="وام کالا">وام کالا</option>
                            <option value="وام رسالت">وام رسالت</option>
                            <option value="سایر وام‌ها">سایر وام‌ها</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">تعداد اقساط باقی‌مانده</label>
                    <input type="number" id="installments" required placeholder="مثلاً 36" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">مبلغ کل وام (تومان)</label>
                    <input type="number" id="amount" required placeholder="100000000" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">قیمت پیشنهادی واگذاری (تومان)</label>
                    <input type="number" id="price" required placeholder="15000000" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">توضیحات و شرایط ضامن</label>
                    <textarea id="description" placeholder="نکات تکمیلی برای خریدار..." class="w-full border border-slate-200 rounded-xl p-2.5 text-xs h-20 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition text-xs shadow-md">
                    انتشار آگهی در سایت
                </button>
            </form>
        </section>

        <!-- لیست آگهی‌ها و ابزار جستجو -->
        <section class="lg:col-span-2 space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col sm:flex-row gap-3">
                <select id="filterType" onchange="fetchLoans()" class="border border-slate-200 rounded-xl p-2.5 text-xs bg-white flex-1 focus:outline-none">
                    <option value="">همه نوع‌های وام</option>
                    <option value="وام ازدواج">وام ازدواج</option>
                    <option value="وام مسکن">وام مسکن</option>
                    <option value="وام کالا">وام کالا</option>
                    <option value="وام رسالت">وام رسالت</option>
                    <option value="سایر وام‌ها">سایر وام‌ها</option>
                </select>
                <input type="text" id="filterSearch" oninput="fetchLoans()" placeholder="جستجو بر اساس نام بانک یا شهر..." class="border border-slate-200 rounded-xl p-2.5 text-xs flex-1 focus:outline-none">
            </div>

            <div>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-black text-slate-800">آگهی‌های تایید شده بازار</h2>
                    <span id="loan-count" class="text-[11px] text-slate-500 bg-white px-2.5 py-1 rounded-full border border-slate-200">0 آگهی</span>
                </div>
                <div id="loans-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <p class="text-slate-400 text-xs col-span-2 text-center py-8">در حال بارگذاری اطلاعات...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- کدهای جاوااسکریپت -->
    <script>
        function formatNumber(num) {
            return new Intl.NumberFormat('fa-IR').format(num);
        }

        window.onload = function() {
            checkAuth();
            fetchLoans();
        };

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('currentUserProfile'));
            if (user) {
                document.getElementById('auth-section').innerHTML = `
                    <div class="flex items-center space-x-2 space-x-reverse text-xs">
                        <span class="bg-blue-800/80 px-3 py-2 rounded-xl text-white font-medium">👤 ${user.name} (${user.city})</span>
                        <button onclick="logout()" class="text-red-300 hover:text-white underline text-[11px]">خروج</button>
                    </div>
                `;
            }
        }

        function openRegisterModal() {
            document.getElementById('registerModal').classList.remove('hidden');
        }

        function closeRegisterModal() {
            document.getElementById('registerModal').classList.add('hidden');
        }

        function saveUser(event) {
            event.preventDefault();
            const user = {
                name: document.getElementById('regName').value,
                phone: document.getElementById('regPhone').value,
                city: document.getElementById('regCity').value
            };
            localStorage.setItem('currentUserProfile', JSON.stringify(user));
            closeRegisterModal();
            checkAuth();
            alert('حساب کاربری شما با موفقیت فعال شد.');
        }

        function logout() {
            localStorage.removeItem('currentUserProfile');
            location.reload();
        }

        function fetchLoans() {
            const container = document.getElementById('loans-list');
            let loans = JSON.parse(localStorage.getItem('loansList')) || [];
            
            const filterType = document.getElementById('filterType').value;
            const filterSearch = document.getElementById('filterSearch').value.toLowerCase();

            let filteredLoans = loans.filter(loan => {
                let matchesType = filterType === "" || loan.loanType === filterType;
                let matchesSearch = filterSearch === "" || 
                    loan.bankName.toLowerCase().includes(filterSearch) || 
                    loan.city.toLowerCase().includes(filterSearch);
                return matchesType && matchesSearch;
            });

            document.getElementById('loan-count').innerText = `${filteredLoans.length} آگهی`;

            if (filteredLoans.length === 0) {
                container.innerHTML = `<div class="bg-white border border-slate-200 p-8 rounded-2xl text-center col-span-2 text-slate-400 text-xs">هیچ آگهی فعالی با این مشخصات یافت نشد.</div>`;
                return;
            }

            container.innerHTML = filteredLoans.map(loan => `
                <div class="bg-white border border-slate-200/80 p-4 rounded-2xl shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-blue-50 text-blue-700 text-[10px] font-bold px-2.5 py-1 rounded-lg">${loan.loanType}</span>
                            <span class="text-[11px] text-slate-500 font-medium">📍 ${loan.city}</span>
                        </div>
                        <h3 class="font-black text-slate-800 text-sm mb-2">${loan.bankName}</h3>
                        <div class="space-y-1 text-xs text-slate-600 mb-3">
                            <div class="flex justify-between"><span>مبلغ وام:</span> <span class="font-bold text-slate-800">${formatNumber(loan.amount)} تومان</span></div>
                            <div class="flex justify-between"><span>اقساط باقی‌مانده:</span> <span class="font-bold text-slate-800">${loan.installments} قسط</span></div>
                        </div>
                        <p class="text-[11px] text-slate-500 bg-slate-50 p-2.5 rounded-xl border border-slate-100">${loan.description || 'بدون توضیحات تکمیلی'}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center">
                        <div>
                            <span class="text-[10px] text-slate-400 block font-medium">قیمت واگذاری</span>
                            <span class="text-xs font-black text-emerald-600">${formatNumber(loan.price)} تومان</span>
                        </div>
                        <button onclick="alert('اطلاعات فروشنده:\\nنام: ${loan.seller.name}\\nتلفن: ${loan.seller.phone}\\nشهر: ${loan.seller.city}')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-[11px] font-bold px-3 py-2 rounded-xl transition">
                            اطلاعات تماس
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function submitLoan(event) {
            event.preventDefault();
            const user = JSON.parse(localStorage.getItem('currentUserProfile'));
            if (!user) {
                alert('لطفاً ابتدا از طریق دکمه بالای صفحه ثبت‌نام کنید.');
                openRegisterModal();
                return;
            }

            const newLoan = {
                id: Date.now(),
                bankName: document.getElementById('bankName').value,
                city: document.getElementById('city').value,
                loanType: document.getElementById('loanType').value,
                installments: document.getElementById('installments').value,
                amount: document.getElementById('amount').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value,
                seller: user
            };

            let loans = JSON.parse(localStorage.getItem('loansList')) || [];
            loans.unshift(newLoan);
            localStorage.setItem('loansList', JSON.stringify(loans));
            alert('آگهی شما با موفقیت ثبت و منتشر شد!');
            document.getElementById('loan-form').reset();
            fetchLoans();
        }
    </script>
</body>
</html>
