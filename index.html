<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آسان وام</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-blue-900 text-white py-4 shadow-md">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">آسان وام</h1>
            <div id="auth-section">
                <button onclick="loginUser()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm transition">ورود / ثبت‌نام</button>
            </div>
        </div>
    </header>
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
            <h2 class="text-lg font-bold text-gray-800 mb-4">ثبت آگهی وام</h2>
            <form id="loan-form" onsubmit="submitLoan(event)" class="space-y-4">
                <input type="text" id="bankName" required placeholder="نام بانک" class="w-full border rounded-lg p-2 text-sm">
                <input type="text" id="city" required placeholder="شهر" class="w-full border rounded-lg p-2 text-sm">
                <select id="loanType" class="w-full border rounded-lg p-2 text-sm text-gray-600">
                    <option value="وام ازدواج">وام ازدواج</option>
                    <option value="وام مسکن">وام مسکن</option>
                    <option value="وام کالا">وام کالا</option>
                    <option value="وام رسالت">وام رسالت</option>
                </select>
                <input type="number" id="installments" required placeholder="تعداد اقساط باقی‌مانده" class="w-full border rounded-lg p-2 text-sm">
                <input type="number" id="amount" required placeholder="مبلغ وام (تومان)" class="w-full border rounded-lg p-2 text-sm">
                <input type="number" id="price" required placeholder="قیمت واگذاری (تومان)" class="w-full border rounded-lg p-2 text-sm">
                <textarea id="description" placeholder="توضیحات تکمیلی..." class="w-full border rounded-lg p-2 text-sm h-20"></textarea>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">ثبت آگهی</button>
            </form>
        </div>
        <div class="md:col-span-2">
            <h2 class="text-xl font-bold text-gray-800 mb-4">آگهی‌های فعال</h2>
            <div id="loans-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <p class="text-gray-500 text-sm">در حال بارگذاری...</p>
            </div>
        </div>
    </main>
    <script>
        function formatNumber(num) { return new Intl.NumberFormat('fa-IR').format(num); }
        
        window.onload = function() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) document.getElementById('auth-section').innerHTML = `<span class="text-green-300 text-sm font-medium">خوش آمدید (${savedUser})</span>`;
            fetchLoans();
        };

        function loginUser() {
            const phone = prompt("شماره موبایل:");
            if (!phone) return;
            localStorage.setItem('currentUser', phone);
            location.reload();
        }

        function fetchLoans() {
            const container = document.getElementById('loans-list');
            let loans = JSON.parse(localStorage.getItem('loansList')) || [];
            if (loans.length === 0) { container.innerHTML = `<p class="text-gray-500 text-sm">هنوز آگهی ثبت نشده.</p>`; return; }
            container.innerHTML = loans.map(loan => `
                <div class="bg-white border p-4 rounded-xl shadow-sm">
                    <span class="bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded-full">${loan.loanType} - ${loan.city}</span>
                    <h3 class="font-bold text-gray-800 mt-2">${loan.bankName}</h3>
                    <p class="text-xs text-gray-500">مبلغ: ${formatNumber(loan.amount)} | اقساط: ${loan.installments}</p>
                    <p class="text-xs text-gray-600 mt-1 italic">${loan.description || ''}</p>
                    <div class="mt-4 pt-2 border-t flex justify-between items-center">
                        <span class="text-sm font-bold text-green-600">${formatNumber(loan.price)} ت</span>
                        <button onclick="alert('تماس با فروشنده: ${loan.phone}')" class="bg-gray-100 text-xs px-3 py-1 rounded-lg">تماس</button>
                    </div>
                </div>
            `).join('');
        }

        function submitLoan(event) {
            event.preventDefault();
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) { alert('ابتدا وارد شوید!'); return; }

            const newLoan = {
                id: Date.now(),
                bankName: document.getElementById('bankName').value,
                city: document.getElementById('city').value,
                loanType: document.getElementById('loanType').value,
                installments: document.getElementById('installments').value,
                amount: document.getElementById('amount').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value,
                phone: currentUser
            };

            let loans = JSON.parse(localStorage.getItem('loansList')) || [];
            loans.unshift(newLoan);
            localStorage.setItem('loansList', JSON.stringify(loans));
            alert('ثبت شد!');
            location.reload();
        }
    </script>
</body>
</html>
